<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智能简历生产工具</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,'Microsoft YaHei','PingFang SC',sans-serif;background:#f0f2f5;color:#333;min-height:100vh}
button{cursor:pointer;font-family:inherit}
input,textarea{font-family:inherit}
.top-bar{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:#fff;padding:14px 32px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(102,126,234,0.3)}
.top-bar h1{font-size:20px;font-weight:600;letter-spacing:1px}
.top-bar .count-badge{background:rgba(255,255,255,0.2);padding:6px 16px;border-radius:20px;font-size:14px;backdrop-filter:blur(4px)}
.top-bar .count-badge .num{font-weight:700;font-size:16px}
.main-wrap{display:flex;gap:24px;padding:24px 32px;max-width:1600px;margin:0 auto;align-items:flex-start}
.left-panel{flex:1;min-width:0;max-width:560px}
.right-panel{flex:1;min-width:0;position:sticky;top:80px}
.form-card{background:#fff;border-radius:12px;padding:24px;margin-bottom:16px;box-shadow:0 1px 4px rgba(0,0,0,0.06)}
.form-card h3{font-size:16px;font-weight:600;color:#333;padding-left:12px;border-left:3px solid #667eea;margin-bottom:16px}
.form-row{display:flex;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.form-row>*{flex:1;min-width:140px}
.form-group{margin-bottom:12px}
.form-group label{display:block;font-size:13px;color:#666;margin-bottom:4px;font-weight:500}
.form-group input,.form-group textarea{width:100%;padding:8px 12px;border:1px solid #ddd;border-radius:6px;font-size:14px;transition:border-color .2s;background:#fafafa}
.form-group input:focus,.form-group textarea:focus{border-color:#667eea;outline:none;background:#fff}
.form-group textarea{resize:vertical;min-height:60px}
.entry-list{margin-bottom:8px}
.entry-item{background:#f8f9fc;border-radius:8px;padding:16px;margin-bottom:12px;border:1px solid #eef0f5;position:relative}
.entry-item .entry-del{position:absolute;top:8px;right:8px;width:24px;height:24px;border-radius:50%;border:none;background:#fee2e2;color:#ef4444;font-size:14px;line-height:24px;text-align:center;padding:0}
.entry-item .entry-del:hover{background:#fecaca}
.btn-add{padding:8px 20px;border:1px dashed #667eea;border-radius:6px;background:transparent;color:#667eea;font-size:13px;width:100%;transition:all .2s}
.btn-add:hover{background:#f0f2ff}
.polish-wrap{display:flex;gap:8px;align-items:flex-start}
.polish-wrap textarea{flex:1}
.btn-polish{padding:6px 14px;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border:none;border-radius:6px;font-size:13px;white-space:nowrap;transition:opacity .2s}
.btn-polish:hover{opacity:.9}
.btn-polish:disabled{opacity:.4;cursor:not-allowed}
.template-switcher{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.btn-tpl{padding:8px 18px;border:2px solid #ddd;border-radius:8px;background:#fff;font-size:13px;transition:all .2s;font-weight:500}
.btn-tpl:hover{border-color:#667eea}
.btn-tpl.active{border-color:#667eea;background:#f0f2ff;color:#667eea}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:1000;justify-content:center;align-items:center}
.modal-overlay.show{display:flex}
.modal-box{background:#fff;border-radius:16px;padding:28px;width:640px;max-width:90vw;max-height:80vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,0.15)}
.modal-box h3{font-size:18px;margin-bottom:16px;color:#333}
.modal-compare{display:flex;flex-direction:column;gap:16px}
.modal-compare .original,.modal-compare .polished{background:#f8f9fc;border-radius:8px;padding:14px;font-size:14px;line-height:1.7}
.modal-compare .original{border-left:3px solid #f59e0b}
.modal-compare .polished{border-left:3px solid #667eea}
.modal-compare .label{font-size:12px;color:#999;margin-bottom:6px;font-weight:600}
.modal-actions{display:flex;gap:12px;justify-content:flex-end;margin-top:20px}
.modal-actions button{padding:8px 24px;border-radius:8px;font-size:14px;border:none}
.modal-actions .btn-cancel{background:#f0f0f0;color:#666}
.modal-actions .btn-apply{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff}
.modal-actions .btn-cancel:hover{background:#e5e5e5}
.modal-actions .btn-apply:hover{opacity:.9}
.btn-pdf{padding:10px 24px;background:#ef4444;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:500;transition:background .2s;display:inline-flex;align-items:center;gap:6px}
.btn-pdf:hover{background:#dc2626}
.action-bar{display:flex;gap:12px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
#resume-preview{background:#fff;box-shadow:0 4px 20px rgba(0,0,0,0.08);border-radius:4px;overflow:hidden;transition:all .3s}
.tpl-simple{padding:40px 44px;color:#333;font-size:13px;line-height:1.6}
.tpl-simple .resume-header{text-align:center;margin-bottom:24px;padding-bottom:20px;border-bottom:2px solid #333}
.tpl-simple .resume-header h2{font-size:26px;font-weight:700;letter-spacing:4px;margin-bottom:8px}
.tpl-simple .resume-header .contact-line{font-size:13px;color:#555;display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
.tpl-simple .resume-header .intent{font-size:14px;color:#667eea;margin-top:6px;font-weight:500}
.tpl-simple .section{margin-bottom:18px}
.tpl-simple .section-title{font-size:15px;font-weight:700;margin-bottom:10px;padding-bottom:4px;border-bottom:1px solid #ddd;color:#222}
.tpl-simple .section-title .en{font-weight:400;color:#999;font-size:12px;margin-left:6px}
.tpl-simple .item{margin-bottom:12px}
.tpl-simple .item-header{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;margin-bottom:2px}
.tpl-simple .item-header .name{font-weight:700;font-size:14px}
.tpl-simple .item-header .meta{color:#888;font-size:12px}
.tpl-simple .item-body{margin-top:4px;white-space:pre-wrap;color:#444;font-size:13px}
.tpl-simple .skill-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.tpl-simple .skill-tags span{background:#f0f0f0;padding:2px 10px;border-radius:3px;font-size:12px;color:#555}
.tpl-simple .summary-text,.tpl-simple .evaluate-text{white-space:pre-wrap;color:#444;font-size:13px;line-height:1.7}
.tpl-professional{display:flex;font-size:13px;line-height:1.6}
.tpl-professional .sidebar{width:220px;background:linear-gradient(180deg,#2c3e50,#34495e);color:#fff;padding:32px 20px;flex-shrink:0}
.tpl-professional .sidebar h2{font-size:22px;font-weight:700;margin-bottom:4px;letter-spacing:2px}
.tpl-professional .sidebar .intent{color:#90cdfe;font-size:13px;margin-bottom:16px}
.tpl-professional .sidebar .contact-block{margin-bottom:20px}
.tpl-professional .sidebar .contact-block .label{font-size:11px;color:rgba(255,255,255,0.5);text-transform:uppercase;letter-spacing:1px;margin-bottom:4px}
.tpl-professional .sidebar .contact-block .val{font-size:13px;color:rgba(255,255,255,0.9);margin-bottom:6px}
.tpl-professional .sidebar .skill-block .tag{display:inline-block;background:rgba(255,255,255,0.15);padding:2px 10px;border-radius:12px;font-size:12px;margin:2px 3px}
.tpl-professional .main-content{flex:1;padding:32px 36px}
.tpl-professional .main-content .section{margin-bottom:20px}
.tpl-professional .main-content .section-title{font-size:15px;font-weight:700;color:#2c3e50;padding-bottom:6px;border-bottom:2px solid #2c3e50;margin-bottom:12px}
.tpl-professional .main-content .item{margin-bottom:14px}
.tpl-professional .main-content .item-header{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap}
.tpl-professional .main-content .item-header .name{font-weight:700;font-size:14px;color:#2c3e50}
.tpl-professional .main-content .item-header .meta{color:#888;font-size:12px}
.tpl-professional .main-content .item-body{margin-top:4px;color:#555;font-size:13px;white-space:pre-wrap}
.tpl-professional .main-content .summary-text,.tpl-professional .main-content .evaluate-text{white-space:pre-wrap;color:#555;font-size:13px;line-height:1.7}
.tpl-creative{padding:0;font-size:13px;line-height:1.6}
.tpl-creative .creative-header{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;padding:36px 44px 28px;position:relative;overflow:hidden}
.tpl-creative .creative-header::after{content:'';position:absolute;right:-40px;top:-40px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,0.05)}
.tpl-creative .creative-header h2{font-size:28px;font-weight:700;letter-spacing:3px;margin-bottom:6px}
.tpl-creative .creative-header .contact-line{display:flex;gap:20px;font-size:13px;opacity:.9;flex-wrap:wrap}
.tpl-creative .creative-header .intent{display:inline-block;background:rgba(255,255,255,0.2);padding:4px 14px;border-radius:20px;font-size:14px;margin-top:8px;backdrop-filter:blur(4px)}
.tpl-creative .creative-body{padding:28px 44px 36px}
.tpl-creative .section{margin-bottom:22px}
.tpl-creative .section-title{font-size:16px;font-weight:700;color:#667eea;display:flex;align-items:center;gap:8px;margin-bottom:12px}
.tpl-creative .section-title .icon{font-size:18px}
.tpl-creative .section-title::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,#667eea,transparent)}
.tpl-creative .item{margin-bottom:14px;border-left:2px solid #f0f2ff;padding-left:12px}
.tpl-creative .item-header{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap}
.tpl-creative .item-header .name{font-weight:700;font-size:14px;color:#333}
.tpl-creative .item-header .name i{color:#667eea;margin-right:4px}
.tpl-creative .item-header .meta{color:#999;font-size:12px}
.tpl-creative .item-body{margin-top:4px;color:#555;font-size:13px;white-space:pre-wrap}
.tpl-creative .skill-tags{display:flex;flex-wrap:wrap;gap:8px}
.tpl-creative .skill-tags span{background:linear-gradient(135deg,#f0f2ff,#fff);color:#667eea;padding:4px 14px;border-radius:16px;font-size:12px;border:1px solid #e0e4ff;font-weight:500}
.tpl-creative .summary-text,.tpl-creative .evaluate-text{white-space:pre-wrap;color:#555;font-size:13px;line-height:1.8;padding:12px 16px;background:#f8f9ff;border-radius:8px}
@media(max-width:1024px){
.main-wrap{flex-direction:column;padding:16px}
.left-panel,.right-panel{max-width:100%}
.right-panel{position:static}
.tpl-professional{flex-direction:column}
.tpl-professional .sidebar{width:100%}
}
.photo-upload{display:flex;align-items:center;gap:16px;margin-bottom:12px}
.photo-upload .photo-preview{width:72px;height:72px;border-radius:50%;object-fit:cover;border:2px solid #e0e4ff;background:#f8f9fc;flex-shrink:0;overflow:hidden}
.photo-upload .photo-preview img{width:100%;height:100%;object-fit:cover}
.photo-upload .photo-preview .placeholder{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#ccc;font-size:28px;background:#f8f9fc}
.photo-upload .photo-actions{display:flex;flex-direction:column;gap:6px}
.photo-upload .photo-actions .btn-upload{display:inline-block;padding:6px 14px;background:#f0f2ff;color:#667eea;border:1px solid #e0e4ff;border-radius:6px;font-size:13px;cursor:pointer;transition:all .2s}
.photo-upload .photo-actions .btn-upload:hover{background:#e0e4ff}
.photo-upload .photo-actions .btn-clear{padding:4px 10px;background:transparent;border:none;color:#999;font-size:12px;cursor:pointer}
.photo-upload .photo-actions .btn-clear:hover{color:#ef4444}
.tpl-simple .photo-header{display:flex;align-items:center;gap:20px;justify-content:center;margin-bottom:16px}
.tpl-simple .photo-header .headshot{width:80px;height:80px;border-radius:50%;object-fit:cover;border:2px solid #eee}
.tpl-professional .sidebar .headshot{width:120px;height:120px;border-radius:50%;object-fit:cover;border:3px solid rgba(255,255,255,0.2);margin:0 auto 16px;display:block}
.tpl-creative .creative-header .photo-name{display:flex;align-items:center;gap:20px}
.tpl-creative .creative-header .headshot{width:80px;height:80px;border-radius:50%;object-fit:cover;border:3px solid rgba(255,255,255,0.3)}
.btn-settings{background:none;border:none;color:#fff;font-size:20px;cursor:pointer;padding:4px 8px;opacity:0.7;transition:opacity .2s;line-height:1}
.btn-settings:hover{opacity:1}
.settings-modal .modal-box{max-width:480px}
.settings-modal .form-group{margin-bottom:14px}
.settings-modal .form-group label{font-size:13px;color:#666;margin-bottom:4px;display:block;font-weight:500}
.settings-modal .form-group select,.settings-modal .form-group input{width:100%;padding:8px 12px;border:1px solid #ddd;border-radius:6px;font-size:14px;background:#fafafa}
.settings-modal .form-group select:focus,.settings-modal .form-group input:focus{border-color:#667eea;outline:none;background:#fff}
.settings-modal .hint{font-size:12px;color:#999;margin-top:4px}
.settings-modal .status-row{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:#f8f9fc;border-radius:8px;margin-bottom:14px}
.settings-modal .status-row .label{font-size:13px;color:#666}
.settings-modal .status-row .val{font-size:13px;font-weight:500}
.settings-modal .status-row .val.active{color:#22c55e}
.settings-modal .status-row .val.inactive{color:#ef4444}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:12px 24px;border-radius:8px;font-size:14px;z-index:2000;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
</style></head><body><div class="top-bar">
  <h1>&#x1F916; 智能简历生产工具</h1>
  <div class="count-badge">AI润色剩余 <span class="num" id="polish-count">20</span> / 20 次</div>
</div>
<div class="toast" id="toast"></div>
<div class="main-wrap">
  <div class="left-panel">
    <div class="form-card">
      <h3>选择模板</h3>
      <div class="template-switcher">
        <button class="btn-tpl active" data-tpl="simple">&#x1F4D1; 简约版</button>
        <button class="btn-tpl" data-tpl="professional">&#x1F4BC; 专业版</button>
        <button class="btn-tpl" data-tpl="creative">&#x2728; 创意版</button>
      </div>
    </div>
    <div class="form-card">
      <h3>基本信息</h3>
      <div class="photo-upload">
        <div class="photo-preview">
          <div id="photo-placeholder" class="placeholder">📷</div>
          <img id="photo-img" style="display:none">
        </div>
        <div class="photo-actions">
          <label class="btn-upload">上传相片<input type="file" id="f-photo" accept="image/*" style="display:none"></label>
          <button class="btn-clear" onclick="clearPhoto()">清除</button>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>姓名</label><input id="f-name" placeholder="请输入姓名"></div>
        <div class="form-group"><label>性别</label><input id="f-gender" placeholder="男/女"></div>
        <div class="form-group"><label>民族</label><input id="f-ethnicity" placeholder="如：汉族"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>祖籍</label><input id="f-hometown" placeholder="如：广东广州"></div>
        <div class="form-group"><label>手机</label><input id="f-phone" placeholder="请输入手机号"></div>
        <div class="form-group"><label>邮箱</label><input id="f-email" placeholder="请输入邮箱"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>求职意向</label><input id="f-intent" placeholder="如：高级前端工程师"></div>
      </div>
      <div class="form-group"><label>个人简介</label><div class="polish-wrap"><textarea id="f-summary" rows="3" placeholder="简要介绍自己，突出核心优势..."></textarea><button class="btn-polish" onclick="openPolishModal('_self',0,'summary')">润色 ✨</button></div></div>
    </div>
    <div class="form-card">
      <h3>&#x1F393; 教育背景</h3>
      <div id="edu-list" class="entry-list"></div>
      <button class="btn-add" onclick="addEntry('edu')">+ 添加教育经历</button>
    </div>
    <div class="form-card">
      <h3>&#x1F4BB; 实习经历</h3>
      <div id="work-list" class="entry-list"></div>
      <button class="btn-add" onclick="addEntry('work')">+ 添加实习经历</button>
    </div>
    <div class="form-card">
      <h3>&#x1F680; 项目经验</h3>
      <div id="proj-list" class="entry-list"></div>
      <button class="btn-add" onclick="addEntry('proj')">+ 添加项目经验</button>
    </div>
    <div class="form-card">
      <h3>&#x1F528; 技能证书</h3>
      <div class="form-group"><label>技能（逗号分隔）</label><input id="f-skills" placeholder="如：JavaScript, Python, React"></div>
      <div class="form-group"><label>证书（逗号分隔）</label><input id="f-certs" placeholder="如：CET-6, 软考中级"></div>
    </div>
    <div class="form-card">
      <h3>&#x1F4DD; 自我评价</h3>
      <div class="form-group"><label>自我评价</label><div class="polish-wrap"><textarea id="f-evaluate" rows="4" placeholder="写一段自我评价..."></textarea><button class="btn-polish" onclick="openPolishModal('_self',0,'evaluate')">润色 ✨</button></div></div>
    </div>
  </div>
  <div class="right-panel">
    <div class="action-bar">
      <button class="btn-pdf" onclick="exportPDF()">&#x1F4C4; 导出 PDF</button>
    </div>
    <div id="resume-preview"></div>
  </div>
</div>
<div class="modal-overlay" id="polish-modal">
  <div class="modal-box">
    <h3>&#x2728; AI 润色</h3>
    <div class="modal-compare">
      <div class="original"><div class="label">原文</div><div id="modal-original"></div></div>
      <div class="polished"><div class="label">润色后</div><div id="modal-polished"><em>正在生成润色建议...</em></div></div>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closePolishModal()">取消</button>
      <button class="btn-apply" id="btn-apply-polish" onclick="applyPolish()">应用</button>
    </div>
  </div>
</div>
<div class="modal-overlay settings-modal" id="settings-modal">
  <div class="modal-box">
    <h3>API 设置</h3>
    <div class="status-row">
      <span class="label">当前状态</span>
      <span class="val" id="settings-status">--</span>
    </div>
    <div class="form-group">
      <label>API 提供商</label>
      <select id="settings-provider" onchange="toggleCustomUrl()">
        <option value="deepseek">DeepSeek</option>
        <option value="openai">OpenAI</option>
        <option value="custom">自定义（兼容 OpenAI）</option>
      </select>
    </div>
    <div class="form-group">
      <label>API Key</label>
      <input id="settings-key" type="password" placeholder="sk-...">
      <div class="hint">不填则使用服务端默认 Key（如有）</div>
    </div>
    <div class="form-group" id="settings-url-group" style="display:none">
      <label>自定义 API 地址</label>
      <input id="settings-url" placeholder="https://your-api.com/v1/chat/completions">
      <div class="hint">须兼容 OpenAI 接口格式</div>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="document.getElementById('settings-modal').classList.remove('show')">关闭</button>
      <button class="btn-apply" onclick="saveSettings()">保存</button>
    </div>
  </div>
</div>
<script>
var resumeData={name:'',gender:'',ethnicity:'',hometown:'',phone:'',email:'',intent:'',summary:'',photo:'',edu:[],work:[],proj:[],skills:'',certs:'',evaluate:''};
var currentTemplate='simple',polishContext=null,STORAGE_KEY='resume_polish_count',API_BASE_URL=window.location.protocol==='file:'?'https://resume-pass-production.up.railway.app':'';
function getPolishCount(){return parseInt(localStorage.getItem(STORAGE_KEY)||'0',10)}
function incPolishCount(){var c=getPolishCount()+1;localStorage.setItem(STORAGE_KEY,String(c));updateCountDisplay();return c}
function updateCountDisplay(){var r=Math.max(0,20-getPolishCount());document.getElementById('polish-count').textContent=r}
updateCountDisplay();
function loadUserApiConfig(){
  var cfg={key:localStorage.getItem('resume_user_key')||'',provider:localStorage.getItem('resume_user_provider')||'deepseek',url:localStorage.getItem('resume_user_url')||''};
  if(!cfg.key)cfg.provider='';return cfg}
function saveUserApiConfig(cfg){
  if(cfg.key)localStorage.setItem('resume_user_key',cfg.key);else localStorage.removeItem('resume_user_key');
  if(cfg.provider)localStorage.setItem('resume_user_provider',cfg.provider);else localStorage.removeItem('resume_user_provider');
  if(cfg.url)localStorage.setItem('resume_user_url',cfg.url);else localStorage.removeItem('resume_user_url')}
function openSettings(){
  var cfg=loadUserApiConfig();
  document.getElementById('settings-provider').value=cfg.provider||'deepseek';
  document.getElementById('settings-key').value=cfg.key||'';
  document.getElementById('settings-url').value=cfg.url||'';

function extractKW(s,n){
	if(!s||!s.trim())return'';n=n||8;
	var cleaned=s.replace(/[^一-龥a-zA-Z0-9]/g,' ').trim();
	if(!cleaned)return'';
	var words=cleaned.split(/\s+/).filter(function(w){return w.length>1});
	if(words.length===0)return cleaned.slice(0,n);
	var filtered=words.filter(function(w){return w.length>=2&&!stopWords(w)});
	filtered=filtered.length>0?filtered:words;
	return filtered.slice(0,3).join(' ').slice(0,n)||cleaned.slice(0,n)}
function stopWords(w){return['我们','他们','可以','这个','那个','一个','通过','进行','使用','利用','采用','实现','相关','方面','关于','以及'].indexOf(w)>=0}
function hasNum(s){return/[0-9]+/.test(s)}
function hashStr(s){var h=0;for(var i=0;i<s.length;i++){h=((h<<5)-h)+s.charCodeAt(i);h|=0}return Math.abs(h)}
function openPolishModal(section,idx,field){
	var text,ft;
	if(section==='_self'){text=resumeData[field]||'';ft=field}
	else{text=resumeData[section][idx][field]||'';ft=section==='work'?'work':'project'}
	if(!text.trim()){showToast('请先填写内容再润色');return}
	if(getPolishCount()>=20){showToast('今日次数已用完
点击右上角 ⚙ 配置自备 API Key 继续使用');return}
	polishContext={section:section,idx:idx,field:field,text:text};
	document.getElementById('modal-original').textContent=text;
	document.getElementById('modal-polished').innerHTML='<em>正在生成润色建议...</em>';
	document.getElementById('polish-modal').classList.add('show');
	var result=clientPolish(text,ft);
	setTimeout(function(){document.getElementById('modal-polished').textContent=result;incPolishCount()},400)}function closePolishModal(){document.getElementById('polish-modal').classList.remove('show');polishContext=null}
function applyPolish(){if(!polishContext)return;var p=document.getElementById('modal-polished').textContent,c=polishContext;if(p.indexOf('网络错误')!==-1||p.indexOf('润色失败')!==-1||p.indexOf('正在生成')!==-1){closePolishModal();return}
if(c.section==='_self'){resumeData[c.field]=p;var el=document.getElementById('f-'+c.field);if(el)el.value=p}else{resumeData[c.section][c.idx][c.field]=p;renderEntries(c.section)};renderPreview();closePolishModal();showToast('润色已应用')}
document.getElementById('polish-modal').addEventListener('click',function(e){if(e.target===this)closePolishModal()});
function exportPDF(){var n=resumeData.name||'简历',el=document.getElementById('resume-preview');showToast('正在生成 PDF...');html2pdf().set({margin:[0,0,0,0],filename:n+'_简历.pdf',image:{type:'jpeg',quality:0.98},html2canvas:{scale:2,useCORS:true,letterRendering:true},jsPDF:{unit:'mm',format:'a4',orientation:'portrait'},pagebreak:{mode:['avoid-all','css','legacy']}}).from(el).save().then(function(){showToast('PDF 导出成功')}).catch(function(){showToast('PDF 导出失败，请重试')})}
</script>
